name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: Database@123
          POSTGRES_DB: invitrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run build

      - name: Create .env.test
        run: |
          cat > .env.test << 'EOF'
          NODE_ENV=test
          DATABASE_URL=postgresql://postgres:Database@123@localhost:5432/invitrack_test
          JWT_ACCESS_SECRET=test-access-secret-do-not-use-in-production
          JWT_REFRESH_SECRET=test-refresh-secret-do-not-use-in-production
          JWT_ACCESS_EXPIRES_IN=15m
          JWT_REFRESH_EXPIRES_IN=7d
          COOKIE_SECRET=test-cookie-secret-do-not-use-in-production
          GOOGLE_CLIENT_ID=test
          GOOGLE_CLIENT_SECRET=test
          GITHUB_CLIENT_ID=test
          GITHUB_CLIENT_SECRET=test
          OAUTH_CALLBACK_BASE_URL=http://localhost:3000
          FRONTEND_URL=http://localhost:5173
          SMTP_HOST=localhost
          SMTP_PORT=587
          SMTP_USER=test@example.com
          SMTP_PASS=test
          SMTP_FROM=test@example.com
          APP_URL=http://localhost:5000
          EOF

      - name: Run tests
        run: npm run test:all